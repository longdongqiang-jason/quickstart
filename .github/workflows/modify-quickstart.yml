name: Modify Quickstart

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modify-quickstart-main
  cancel-in-progress: false

jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Modify Quickstart dashboard
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("luci-app-quickstart/htdocs/luci-static/quickstart")
          app_file = root / "app.js"
          index_file = root / "index.js"
          app = app_file.read_text(encoding="utf-8")
          index = index_file.read_text(encoding="utf-8")

          def replace(old, new):
              global app
              if app.count(new) == 1:
                  return
              if app.count(old) != 1:
                  raise SystemExit(f"app.js 结构已变化，无法定位：{old[:120]}")
              app = app.replace(old, new, 1)

          if 'const onlineUpdatePage = ' not in app:
              replace('}],As=[{id:"tool-lan"', '''}];
          const maintenancePage = "/cgi-bin/luci/admin/system/flash";
          const onlineUpdatePage = maintenancePage + "?online_update=1";
          const As=[{id:"tool-lan"''')
          replace('detail:"升级与自动检查",detailEn:"Update & auto-check",glyph:"download",path:"/cgi-bin/luci/admin/system/ota",kind:"tool",tone:"violet",tool:"firmware"', 'detail:"打开在线更新",detailEn:"Open online update",glyph:"download",path:onlineUpdatePage,kind:"tool",tone:"violet",tool:"firmware"')
          replace('glyph:"tune",path:"/cgi-bin/luci/admin/store/pages/maintance",kind:"tool"', 'glyph:"tune",path:maintenancePage,kind:"tool"')
          # Accept both the older maintenance popup and an unpatched launcher.
          hook = 'if(be.kind==="tool"){'
          legacy = 'if(be.id==="tool-maintenance"){window.openX86OnlineUpdate();return}'
          route = 'if(be.id==="tool-maintenance"){window.location.assign(be.path);return}if(be.id==="tool-firmware"){window.openX86OnlineUpdate(be.path);return}'
          if hook + route not in app:
              if hook + legacy in app:
                  replace(hook + legacy, hook + route)
              else:
                  replace(hook + 'Te&&ut.updateNetworkStatus', hook + route + 'Te&&ut.updateNetworkStatus')

          for target in ('Jy={href:', 'label:o(t)("备份升级"),href:'):
              for path in ('"/cgi-bin/luci/admin/system/flash?online_update=1"', '"/cgi-bin/luci/admin/system/flash"'):
                  if target + path in app:
                      replace(target + path, target + 'maintenancePage')
                      break
              else:
                  if target + 'maintenancePage' not in app:
                      raise SystemExit("app.js 缺少备份升级链接")

          replace('terminal:"ttyd",firmware:"ota",sandbox:"sandbox"', 'terminal:"ttyd",sandbox:"sandbox"')

          # Preserve the full widget registry for validation against router-stored layouts.
          # Project the editable/displayed rows only after reading the stored layout.
          replace('const rt=s=>JSON.parse(JSON.stringify(s));', '''const hiddenHomeWidgets = new Set(["sharing", "downloads", "remote"]);

          function visibleHomeRows(rows) {
              return rows.flatMap(row => {
                  const hasHiddenWidget = row.columns.some(column =>
                      column.cards.some(id => hiddenHomeWidgets.has(id))
                  );
                  if (!hasHiddenWidget) return [row];

                  let columns = row.columns.flatMap(column => {
                      const cards = column.cards.filter(id => id && !hiddenHomeWidgets.has(id));
                      if (cards.length === 0) return [];
                      if (cards.length === 2) return [{...column, cards}];
                      return [{weight: column.weight, split: 50, cards}];
                  });
                  if (columns.length === 0) return [];
                  if (columns.length === 1 && columns[0].cards.length === 2) {
                      columns = columns[0].cards.map(id => ({weight: 50, split: 50, cards: [id]}));
                  }
                  const template = Yn.find(option =>
                      option.slots.length === columns.length &&
                      option.slots.every((slots, index) => slots === columns[index].cards.length)
                  );
                  const totalWeight = columns.reduce((total, column) => total + column.weight, 0);
                  return [{...row, template: template.id, columns: columns.map(column => ({
                      ...column, weight: column.weight * 100 / totalWeight
                  }))}];
              });
          }

          const rt=s=>JSON.parse(JSON.stringify(s));''')
          replace('E=R(()=>l.config.rows)', 'E=R(()=>visibleHomeRows(l.config.rows))')
          replace('[...Un,...Array.from(new Set([...hi.map', '[...Un.filter(widget=>!hiddenHomeWidgets.has(widget.id)),...Array.from(new Set([...hi.map')
          replace('rows:R1(),issue:', 'rows:visibleHomeRows(R1()),issue:')
          replace('R(()=>Un.filter(M=>!qe.value.includes(M.id)))', 'R(()=>Un.filter(M=>!hiddenHomeWidgets.has(M.id)&&!qe.value.includes(M.id)))')


          toolbar = 'Ew={class:"home-top","data-home-top":"",style:{marginTop:"-16px"}}'
          replace(toolbar if toolbar in app else 'Ew={class:"home-top","data-home-top":""}', 'Ew={class:"home-top","data-home-top":"",style:{marginTop:"-56px"}}')

          # Use the website destination configured in the supplied workflow.
          website = "https://github.com/longdongqiang-jason/X86-daed/releases/latest"
          site_anchor = 'Dw={href:'
          for href in (f'"{website}"', '"https://github.com/longdongqiang-jason/X86-daed/releases/latest"', '"https://www.istoreos.com/"', 'firmwareReleases'):
              if site_anchor + href in app:
                  replace(site_anchor + href, site_anchor + f'"{website}"')
                  break
          else:
              raise SystemExit("app.js 缺少右上角官网链接")
          if 'r("iStoreOS官网","iStoreOS website")' in app:
              replace('r("iStoreOS官网","iStoreOS website")', 'r("官网","Website")')

          # Replace the old overlay and use the same app.js URL as the lazy modules.
          helper_pattern = r"\A/\* quickstart-online-modal-v\d+:[\s\S]*?\n\}\)\(\);\n?"
          index = re.sub(helper_pattern, "", index, count=1)
          entry_import = r'(from["\']\./app\.js(?:\?[^"\']*)?)(["\'])'

          def normalize_import(match):
              path, _, query = match[1].partition("?")
              query = "&".join(part for part in query.split("&") if part and part != "x86_online_modal=1")
              return path + ("?" + query if query else "") + match[2]

          index, imports = re.subn(entry_import, normalize_import, index)
          if imports != 1:
              raise SystemExit("index.js 缺少唯一的 app.js 模块导入")

          helper = r'''/* quickstart-online-modal-v5: preserve the dashboard and reuse native flash flow. */
          (function () {
              var active = null;
              window.openX86OnlineUpdate = function (url) {
                  if (active) return;
                  var layer = document.createElement('div');
                  layer.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:transparent';
                  var frame = document.createElement('iframe');
                  frame.title = '在线更新';
                  frame.style.cssText = 'width:100%;height:100%;border:0;background:transparent;color-scheme:only light;visibility:hidden;opacity:0';
                  frame.setAttribute('allowtransparency', 'true');
                  var hint = document.createElement('div');
                  hint.textContent = '正在打开在线更新…';
                  hint.style.cssText = 'display:none;position:absolute;top:40%;left:50%;transform:translateX(-50%);background:white;color:#333;padding:24px;border-radius:6px';
                  var exit = document.createElement('button');
                  exit.type = 'button';
                  exit.textContent = '关闭窗口';
                  exit.style.cssText = 'display:none;position:absolute;right:16px;top:8px;z-index:2;padding:6px 12px;border:1px solid #bbb;border-radius:4px;cursor:pointer;color:#333;background:white';
                  var timer = null, seen = false, idleSince = 0, revealPending = false;
                  var loadingTimer = window.setTimeout(function () {
                      if (!seen && active === layer) { hint.style.display = "block"; exit.style.display = "block"; }
                  }, 1200);
                  var oldOverflow = document.body.style.overflow;
                  function close() {
                      if (timer) window.clearInterval(timer);
                      window.clearTimeout(deadline);
                      window.clearTimeout(loadingTimer);
                      layer.remove();
                      document.body.style.overflow = oldOverflow;
                      active = null;
                  }
                  exit.onclick = function () {
                      /* Let the original modal close handler stop progress polling first. */
                      try {
                          var doc = frame.contentDocument;
                          var buttons = doc.querySelectorAll('#modal_overlay button');
                          for (var i = 0; i < buttons.length; i++) {
                              if (/^(关闭|取消|Close|Cancel)$/i.test(buttons[i].textContent.trim()) && !buttons[i].disabled) {
                                  buttons[i].click(); break;
                              }
                          }
                      } catch (e) {}
                      close();
                  };
                  var deadline = window.setTimeout(function () {
                      if (!seen) hint.textContent = '未能打开更新窗口。请确认 flash.js 已加入自动打开逻辑，且当前登录有效。';
                  }, 30000);
                  frame.onload = function () {
                      if (timer) window.clearInterval(timer);
                      try {
                          var doc = frame.contentDocument;
                          if (doc.querySelector('input[type="password"]')) {
                              hint.textContent = '登录已失效，请刷新首页并重新登录后再试。';
                              return;
                          }
                          var style = doc.createElement('style');
                          // Match the iframe and document color schemes so the browser keeps
                          // the embedded canvas transparent, even with a dark LuCI theme.
                          style.textContent = `
                              :root { color-scheme: only light !important; }
                              html, body, #modal_overlay, #modal_overlay::before, #modal_overlay::after {
                                  background: transparent !important;
                                  background-image: none !important;
                                  box-shadow: none !important;
                                  backdrop-filter: none !important;
                              }
                              html::before, html::after, body::before, body::after {
                                  display: none !important;
                              }
                              body { visibility: hidden !important; }
                              body > :not(#modal_overlay) { display: none !important; }
                              body.modal-overlay-active #modal_overlay,
                              body.modal-overlay-active #modal_overlay * { visibility: visible !important; }
                              body.modal-overlay-active #modal_overlay {
                                  position: fixed !important;
                                  inset: 0 !important;
                                  margin: 0 !important;
                                  z-index: 2147483000 !important;
                              }
                              #modal_overlay, #modal_overlay .modal {
                                  animation: none !important;
                                  transition: none !important;
                              }
                          `;
                          doc.head.appendChild(style);
                          doc.addEventListener('click', function (event) {
                              var button = event.target.closest && event.target.closest('button');
                              if (!button || button.disabled ||
                                  !/^(关闭|取消|Close|Cancel)$/i.test(button.textContent.trim())) return;
                              window.setTimeout(function () {
                                  if (active === layer && !doc.body.classList.contains('modal-overlay-active')) close();
                              }, 0);
                          }, true);
                          timer = window.setInterval(function () {
                              var showing = doc.body.classList.contains('modal-overlay-active');
                              if (showing) {
                                  seen = true; idleSince = 0;
                                  hint.style.display = 'none';
                                  if (!revealPending) {
                                      revealPending = true;
                                      window.requestAnimationFrame(function () {
                                          window.requestAnimationFrame(function () {
                                              if (active !== layer) return;
                                              layer.style.background = 'rgba(0,0,0,.4)';
                                              frame.style.visibility = 'visible';
                                              frame.style.opacity = '1';
                                          });
                                      });
                                  }
                                  /* Avoid an extra dismiss button during a running upgrade. */
                                  exit.style.display = 'none';
                                  window.clearTimeout(deadline);
                              } else if (seen) {
                                  if (!idleSince) idleSince = Date.now();
                                  if (Date.now() - idleSince > 1500) close();
                              }
                          }, 150);
                      } catch (e) {
                          hint.textContent = '无法加载同源升级页面：' + e.message;
                      }
                  };
                  active = layer;
                  document.body.style.overflow = 'hidden';
                  layer.appendChild(frame); layer.appendChild(hint); layer.appendChild(exit);
                  document.body.appendChild(layer);
                  frame.src = url;
              };
          })();
          '''

          app_file.write_text(app, encoding="utf-8")
          index_file.write_text(helper + index, encoding="utf-8")

      - name: Check JavaScript module syntax
        run: |
          dir=luci-app-quickstart/htdocs/luci-static/quickstart
          node --input-type=module --check < "$dir/app.js"
          node --input-type=module --check < "$dir/index.js"

      - name: Modify Makefile
        shell: python
        run: |
          from pathlib import Path
          file = Path("luci-app-quickstart/Makefile")
          content = file.read_text(encoding="utf-8")
          file.write_text(content.replace("+luci-app-store", ""), encoding="utf-8")

      - name: Show changes
        run: git diff --stat -- luci-app-quickstart/htdocs/luci-static/quickstart/index.js luci-app-quickstart/htdocs/luci-static/quickstart/app.js luci-app-quickstart/Makefile

      - name: Commit and push
        run: |
          git add luci-app-quickstart/htdocs/luci-static/quickstart/index.js luci-app-quickstart/Makefile
          git add luci-app-quickstart/htdocs/luci-static/quickstart/app.js
          if git diff --cached --quiet; then
            echo "没有修改，不需要提交。"
            exit 0
          fi
          git commit -m "fix: open firmware update dialog from quickstart dashboard"
          git push origin HEAD:main
