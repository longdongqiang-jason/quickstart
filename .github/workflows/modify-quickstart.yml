name: Modify Quickstart Website Label

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename website label
        shell: python
        run: |
          from pathlib import Path

          file = Path("luci-app-quickstart/htdocs/luci-static/quickstart/index.js")
          original = file.read_bytes()
          updated = original.replace(
              rb"iStoreOS\u5B98\u7F51", rb"\u5B98\u7F51"
          ).replace("iStoreOS官网".encode("utf-8"), "官网".encode("utf-8"))
          if updated != original:
              file.write_bytes(updated)
          else:
              print("未找到旧文案，无需提交。")

      - name: Commit and push
        run: |
          git add -- luci-app-quickstart/htdocs/luci-static/quickstart/index.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: rename Quickstart website label'
          git push origin HEAD:main
